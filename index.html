  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/effets.css">
  <!-- Contenu du site (chargé tôt pour décider de l'intro avant l'affichage) -->
  <script src="js/data.js"></script>
  <!-- Signale au CSS que JavaScript est actif (active les animations),
       puis décide si l'intro cinématique doit être jouée : une seule fois
       par session, jamais si « réduire les animations » est activé. -->
  <script>
    (function () {
      var r = document.documentElement;
      r.classList.add('js');
      try {
        var e = (window.SITE && window.SITE.effets) || {};
        if (e.intro === false) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (window.sessionStorage.getItem('intro-vue')) return;
        r.classList.add('intro-on', 'intro-attente');
        // Sécurité : si l'intro ne démarre pas (réseau coupé…), le site s'affiche quand même
        setTimeout(function () { r.classList.remove('intro-on', 'intro-attente'); }, 6000);
      } catch (err) { /* stockage indisponible : pas d'intro */ }
    })();
  </script>
</head>
<body>
